# IMPORTANT: Replace the placeholder base64 values in values.yaml
# with real secrets before deploying.
#
# To encode a value:  echo -n "your-value" | base64
# To decode a value:  echo "base64string" | base64 -d
apiVersion: v1
kind: Secret
metadata:
  name: devbot-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "agent-security-lab.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value }}
  {{- end }}
