apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiki
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: wiki
    {{- include "agent-security-lab.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.wiki.replicas }}
  selector:
    matchLabels:
      app: wiki
  template:
    metadata:
      labels:
        app: wiki
        app.kubernetes.io/name: wiki
    spec:
      containers:
        - name: wiki
          image: "{{ .Values.wiki.image.repository }}:{{ .Values.wiki.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: 80
          resources:
            {{- toYaml .Values.wiki.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: wiki
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: wiki
    {{- include "agent-security-lab.labels" . | nindent 4 }}
spec:
  type: {{ .Values.wiki.service.type }}
  selector:
    app: wiki
  ports:
    - port: {{ .Values.wiki.service.port }}
      targetPort: 80
      protocol: TCP
