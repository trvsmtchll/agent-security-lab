apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: mcp-server
    {{- include "agent-security-lab.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.mcpServer.replicas }}
  selector:
    matchLabels:
      app: mcp-server
      tier: tool-server
  template:
    metadata:
      labels:
        app: mcp-server
        tier: tool-server
        app.kubernetes.io/name: mcp-server
    spec:
      containers:
        - name: mcp-server
          image: "{{ .Values.mcpServer.image.repository }}:{{ .Values.mcpServer.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: 9000
          envFrom:
            - configMapRef:
                name: devbot-config
            - secretRef:
                name: devbot-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.mcpServer.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: mcp-server
    {{- include "agent-security-lab.labels" . | nindent 4 }}
spec:
  type: {{ .Values.mcpServer.service.type }}
  selector:
    app: mcp-server
    tier: tool-server
  ports:
    - port: {{ .Values.mcpServer.service.port }}
      targetPort: 9000
      protocol: TCP
