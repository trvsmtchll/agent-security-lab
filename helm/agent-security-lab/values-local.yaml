# values-local.yaml — Overrides for local development
# Usage: helm install agent-security-lab ./helm/agent-security-lab -f helm/agent-security-lab/values-local.yaml

imagePullPolicy: IfNotPresent

postgres:
  image:
    tag: latest
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"

