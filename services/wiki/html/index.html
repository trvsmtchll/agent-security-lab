<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Wiki</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            color: #333;
            line-height: 1.6;
        }
        h1 {
            border-bottom: 2px solid #2563eb;
            padding-bottom: 10px;
            color: #1e293b;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        ul li {
            padding: 12px 16px;
            margin: 8px 0;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
        }
        ul li a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
        }
        ul li a:hover {
            text-decoration: underline;
        }
        .badge {
            display: inline-block;
            background: #dbeafe;
            color: #1d4ed8;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            margin-left: 8px;
            vertical-align: middle;
        }
        footer {
            margin-top: 60px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            font-size: 0.85rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <h1>Engineering Wiki</h1>
    <p>Internal documentation for the engineering team. Select a document below.</p>
    <ul>
        <li>
            <a href="/runbook.html">Deployment Runbook &mdash; v2.3</a>
            <span class="badge">Updated</span>
        </li>
    </ul>
    <footer>
        Internal use only. Do not distribute outside the organization.
    </footer>
</body>
</html>
